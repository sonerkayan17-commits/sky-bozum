<rect x="675" y="550" width="790" height="72" rx="18" fill="#dfedf7"/><circle cx="715" cy="586" r="24" fill="url(#cyan)"/><text x="707" y="594" fill="#062b44" font-size="20" font-weight="800">2</text><text x="760" y="577" fill="#14384f" font-size="25" font-weight="700">Para birimini doğrula</text><text x="760" y="605" fill="#58758a" font-size="18">TL, USD ve EUR kodları aynı hesapta çalışmayabilir.</text>
<rect x="675" y="645" width="790" height="72" rx="18" fill="#dfedf7"/><circle cx="715" cy="681" r="24" fill="url(#cyan)"/><text x="707" y="689" fill="#062b44" font-size="20" font-weight="800">3</text><text x="760" y="672" fill="#14384f" font-size="25" font-weight="700">Bakiyeyi mağazada kullan</text><text x="760" y="700" fill="#58758a" font-size="18">Oyun, eklenti ve desteklenen içerik koşullarını incele.</text>
