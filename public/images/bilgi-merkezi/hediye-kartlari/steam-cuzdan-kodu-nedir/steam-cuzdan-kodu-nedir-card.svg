<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Steam cüzdan kodu rehberi</title><desc id="desc">Steam cüzdan kodunda para birimi, hesap bölgesi ve mağaza bakiyesi kontrolünü anlatan premium editoryal kapak.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset=".55" stop-color="#0a2d4d"/><stop offset="1" stop-color="#14608b"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75ddff"/><stop offset="1" stop-color="#2ea7e0"/></linearGradient></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/><circle cx="1430" cy="135" r="250" fill="#6fd7ff" opacity=".12"/><path d="M0 760C280 650 490 860 760 760s500-120 840-30v170H0z" fill="#0b2440" opacity=".72"/>
