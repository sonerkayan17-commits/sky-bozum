<text x="85" y="180" fill="#fff" font-size="62" font-weight="800">Bölge ve para birimi</text><text x="85" y="247" fill="#fff" font-size="62" font-weight="800">kontrolü neden önemli?</text>
<text x="85" y="300" fill="#b7d5e8" font-size="26">Kod, hesap ülkesi ve mağaza para birimi uyumunu karşılaştırın.</text>
