 <text x="130" y="410" fill="#0d3b2f" font-size="22" font-weight="700">KOD ÖZETİ</text>
 <rect x="130" y="445" width="460" height="82" rx="20" fill="#dff5eb"/><text x="165" y="495" fill="#174c3d" font-size="31" font-weight="800">₺250 Uygulama Bakiyesi</text>
 <rect x="130" y="555" width="460" height="58" rx="16" fill="#0d2d26"/><text x="160" y="592" fill="#d7f9eb" font-size="22" letter-spacing="5">XXXX-XXXX-XXXX</text><circle cx="548" cy="584" r="16" fill="#38d895"/><path d="M540 584l6 6 11-15" fill="none" stroke="#073727" stroke-width="5" stroke-linecap="round"/>
 <text x="130" y="658" fill="#52746a" font-size="20">Kod yalnızca uygun ülke hesabında kullanılmalıdır.</text>
 <rect x="705" y="350" width="805" height="420" rx="38" fill="#09251f" stroke="#3ed39a" stroke-width="2"/>
 <text x="755" y="410" fill="#7ef0bf" font-size="24" font-weight="700">KULLANIM YOLU</text>
 <g>
  <circle cx="785" cy="485" r="30" fill="url(#accent)"/><text x="775" y="495" fill="#063426" font-size="25" font-weight="800">1</text>
  <text x="840" y="480" fill="#fff" font-size="27" font-weight="700">Hesap bölgesini doğrula</text><text x="840" y="512" fill="#a9cfc2" font-size="19">Kart ülkesi ile Google hesabı eşleşmeli.</text>
  <line x1="785" y1="520" x2="785" y2="575" stroke="#2e8a68" stroke-width="4"/>
  <circle cx="785" cy="610" r="30" fill="url(#accent)"/><text x="775" y="620" fill="#063426" font-size="25" font-weight="800">2</text>
  <text x="840" y="605" fill="#fff" font-size="27" font-weight="700">Kodu hesaba tanımla</text><text x="840" y="637" fill="#a9cfc2" font-size="19">Bakiye Google Play hesabına eklenir.</text>
  <line x1="785" y1="645" x2="785" y2="700" stroke="#2e8a68" stroke-width="4"/>
  <circle cx="785" cy="735" r="30" fill="url(#accent)"/><text x="775" y="745" fill="#063426" font-size="25" font-weight="800">3</text>
  <text x="840" y="730" fill="#fff" font-size="27" font-weight="700">Uygun içerikte kullan</text><text x="840" y="762" fill="#a9cfc2" font-size="19">Uygulama, oyun ve abonelik koşullarını kontrol et.</text>
 </g>
 <text x="90" y="825" fill="#9bc8b9" font-size="20">bozumcu.net • Bilgi Merkezi</text>
