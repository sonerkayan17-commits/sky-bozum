<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Google Play hediye kartı kullanım rehberi</title><desc id="desc">Google Play kodunun bölge kontrolü, hesaba tanımlanması ve uygulama içi kullanım akışını gösteren premium editoryal kapak.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a18"/><stop offset=".55" stop-color="#0b3028"/><stop offset="1" stop-color="#0f4f3d"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eaf7f1"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47e0a2"/><stop offset="1" stop-color="#19b876"/></linearGradient>
</defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/>
<circle cx="1410" cy="110" r="250" fill="#46d69e" opacity=".12"/><circle cx="130" cy="820" r="250" fill="#1f9d72" opacity=".10"/>
<g font-family="Arial, Helvetica, sans-serif">
 <text x="90" y="105" fill="#7ef0bf" font-size="28" font-weight="700" letter-spacing="5">GOOGLE PLAY • HEDİYE KARTI</text>
 <text x="90" y="175" fill="#fff" font-size="60" font-weight="800">Kodu bakiyeye</text><text x="90" y="240" fill="#fff" font-size="60" font-weight="800">dönüştürme rehberi</text>
 <text x="90" y="290" fill="#c8e6dc" font-size="27">Bölge, hesap ve içerik uygunluğunu tek akışta kontrol edin.</text>
