<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kredim limiti nasıl aktif edilir?</title>
  <desc id="desc">Kredim limit aktivasyonunun başvuru, kimlik doğrulama, değerlendirme ve limit tanımlama adımlarını gösteren premium rehber görseli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b28"/><stop offset="1" stop-color="#0d4346"/></linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4de2bf"/><stop offset="1" stop-color="#6177ff"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="1070" cy="120" r="180" fill="#1f6870" opacity=".18"/>
  <circle cx="910" cy="680" r="250" fill="#253f9b" opacity=".17"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="58" y="58" width="165" height="30" rx="15" fill="#0f3940"/><circle cx="78" cy="73" r="5" fill="#55dfbf"/><text x="91" y="79" fill="#7ce7d1" font-size="13" font-weight="700" letter-spacing="1.1">AKTİVASYON REHBERİ</text>
    <text x="58" y="142" fill="#fff" font-size="46" font-weight="800">Kredim limiti nasıl aktif edilir?</text>
    <text x="58" y="180" fill="#a9bec7" font-size="19">Başvuru, kimlik doğrulama ve değerlendirme tamamlandığında limit hesaba tanımlanır.</text>

    <rect x="58" y="230" width="465" height="340" rx="30" fill="#0a2c38" stroke="#5fe2c5" stroke-opacity=".2"/>
    <text x="92" y="272" fill="#8aa8b3" font-size="14" font-weight="700" letter-spacing="1">AKTİVASYON ADIMLARI</text>
    <path d="M126 326v172" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"/>
    <g><circle cx="126" cy="326" r="24" fill="#4de2bf"/><text x="126" y="334" text-anchor="middle" fill="#062832" font-size="20" font-weight="900">1</text><text x="170" y="320" fill="#fff" font-size="19" font-weight="750">Başvuruyu başlat</text><text x="170" y="344" fill="#8eaab5" font-size="14">Hesap ve iletişim bilgilerini eksiksiz gir.</text></g>
    <g><circle cx="126" cy="412" r="24" fill="#4ec7d2"/><text x="126" y="420" text-anchor="middle" fill="#072c37" font-size="20" font-weight="900">2</text><text x="170" y="406" fill="#fff" font-size="19" font-weight="750">Kimliğini doğrula</text><text x="170" y="430" fill="#8eaab5" font-size="14">Kimlik ve iletişim eşleşmesini onayla.</text></g>
    <g><circle cx="126" cy="498" r="24" fill="#6177ff"/><text x="126" y="506" text-anchor="middle" fill="#fff" font-size="20" font-weight="900">3</text><text x="170" y="492" fill="#fff" font-size="19" font-weight="750">Değerlendirme sonucunu gör</text><text x="170" y="516" fill="#8eaab5" font-size="14">Uygunluk sonrası limit otomatik tanımlanır.</text></g>

    <rect x="560" y="230" width="582" height="340" rx="30" fill="#092735" stroke="#6885ff" stroke-opacity=".22"/>
    <rect x="610" y="276" width="238" height="244" rx="28" fill="#eaf5f7"/>
    <rect x="690" y="295" width="78" height="10" rx="5" fill="#b6c9cf"/>
    <text x="638" y="343" fill="#48636e" font-size="13" font-weight="700">KULLANILABİLİR LİMİT</text><text x="638" y="392" fill="#102c38" font-size="39" font-weight="850">₺18.000</text>
    <rect x="638" y="418" width="182" height="14" rx="7" fill="#c6d7dc"/><rect x="638" y="418" width="130" height="14" rx="7" fill="url(#grad)"/>
    <rect x="638" y="455" width="182" height="40" rx="13" fill="#173a46"/><circle cx="659" cy="475" r="10" fill="#4de2bf"/><path d="M654 475l4 4 7-9" fill="none" stroke="#063039" stroke-width="3" stroke-linecap="round"/><text x="679" y="481" fill="#fff" font-size="14" font-weight="700">Limit aktif</text>

    <path d="M875 395h78" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"/><path d="M940 380l18 15-18 15" fill="none" stroke="#6177ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="971" y="300" width="125" height="190" rx="26" fill="#123745" stroke="#61dfc4" stroke-opacity=".34"/>
    <rect x="995" y="327" width="77" height="55" rx="13" fill="#4de2bf"/><path d="M1014 354h39" stroke="#07303a" stroke-width="8" stroke-linecap="round"/>
    <text x="1033" y="418" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">Hesabına</text><text x="1033" y="439" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">tanımlandı</text>
    <circle cx="1033" cy="466" r="12" fill="#6177ff"/><path d="M1027 466l4 4 8-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

    <rect x="580" y="532" width="542" height="46" rx="15" fill="#103641"/><text x="606" y="560" fill="#9db3bc" font-size="14">Not: Başvurunun sonucu kişisel değerlendirmeye bağlıdır; limit garantisi vermez.</text>
    <text x="58" y="628" fill="#65808d" font-size="12" letter-spacing="1">SKY BOZUM • BİLGİ MERKEZİ • BOZUMCU.NET</text>
  </g>
</svg>
