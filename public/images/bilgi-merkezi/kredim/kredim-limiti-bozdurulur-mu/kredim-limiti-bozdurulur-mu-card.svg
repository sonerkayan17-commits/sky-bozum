<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#173246"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2d3d"/><stop offset="1" stop-color="#0b202e"/></linearGradient></defs>
<rect width="1600" height="900" rx="46" fill="url(#bg)"/><circle cx="1420" cy="110" r="280" fill="#ff8a3d" opacity=".08"/><circle cx="120" cy="820" r="220" fill="#35d0a2" opacity=".06"/>
<g font-family="Arial, sans-serif"><text x="90" y="105" fill="#ffad66" font-size="28" font-weight="700" letter-spacing="3">KREDİM • GERÇEK KULLANIM REHBERİ</text><text x="90" y="178" fill="#fff" font-size="64" font-weight="800">Kredim limiti bozdurulur mu?</text><text x="90" y="230" fill="#b7c8d4" font-size="28">Alışveriş limiti, doğrudan nakit bakiye değildir</text></g>
<g transform="translate(90 310)" font-family="Arial, sans-serif"><rect width="600" height="430" rx="34" fill="url(#card)" stroke="#31576d"/><text x="38" y="58" fill="#8fb2c4" font-size="22">LİMİTİN ASIL AMACI</text><text x="38" y="112" fill="#fff" font-size="38" font-weight="800">Ürün ve hizmet satın almak</text><g transform="translate(38 160)"><rect width="524" height="72" rx="20" fill="#12394a"/><circle cx="38" cy="36" r="15" fill="#36d2a1"/><path d="M31 36l5 5 10-12" stroke="#06251d" stroke-width="5" fill="none"/><text x="72" y="45" fill="#dff8ef" font-size="24">Anlaşmalı mağaza ve ürün kontrolü</text></g><g transform="translate(38 250)"><rect width="524" height="72" rx="20" fill="#183042"/><circle cx="38" cy="36" r="15" fill="#ffb15f"/><path d="M38 25v22M27 36h22" stroke="#4b2907" stroke-width="4"/><text x="72" y="45" fill="#ffe8cf" font-size="24">Limit, sözleşme ve hesap uygunluğu</text></g><g transform="translate(38 340)"><rect width="524" height="58" rx="18" fill="#231f2a" stroke="#6f4a54"/><text x="24" y="38" fill="#ffc7c7" font-size="21">Nakit çekim veya garanti bozum işlevi sunmaz</text></g></g>
<g transform="translate(770 310)" font-family="Arial, sans-serif"><rect width="740" height="430" rx="34" fill="#0b1f2d" stroke="#314b5e"/><text x="42" y="58" fill="#8fb2c4" font-size="22">İŞLEM ÖNCESİ 3 KONTROL</text><g transform="translate(42 100)"><circle cx="48" cy="48" r="46" fill="#173b4d"/><text x="48" y="60" text-anchor="middle" fill="#56dfb1" font-size="34" font-weight="800">1</text><text x="120" y="40" fill="#fff" font-size="28" font-weight="700">Resmî kullanım alanı</text><text x="120" y="72" fill="#a9bdc9" font-size="21">Mağaza, ürün ve kampanya koşullarını doğrula</text></g><g transform="translate(42 205)"><circle cx="48" cy="48" r="46" fill="#3a301e"/><text x="48" y="60" text-anchor="middle" fill="#ffc46b" font-size="34" font-weight="800">2</text><text x="120" y="40" fill="#fff" font-size="28" font-weight="700">Aracı tekliflere dikkat</text><text x="120" y="72" fill="#a9bdc9" font-size="21">Kesin kazanç ve risksiz dönüşüm vaatlerine güvenme</text></g><g transform="translate(42 310)"><circle cx="48" cy="48" r="46" fill="#3a2028"/><text x="48" y="60" text-anchor="middle" fill="#ff7b89" font-size="34" font-weight="800">3</text><text x="120" y="40" fill="#fff" font-size="28" font-weight="700">Hesap güvenliği</text><text x="120" y="72" fill="#a9bdc9" font-size="21">Kod, şifre ve doğrulama bilgilerini paylaşma</text></g></g>
<g font-family="Arial, sans-serif"><rect x="90" y="785" width="1420" height="60" rx="18" fill="#102a38" stroke="#28495b"/><text x="120" y="824" fill="#d8e8ef" font-size="22">Özet: Kredim limiti alışveriş kullanımına yöneliktir; nakit dönüşüm iddialarında sözleşme, güvenlik ve hesap riski bulunabilir.</text><text x="1425" y="824" text-anchor="end" fill="#ffad66" font-size="20" font-weight="700">bozumcu.net</text></g></svg>