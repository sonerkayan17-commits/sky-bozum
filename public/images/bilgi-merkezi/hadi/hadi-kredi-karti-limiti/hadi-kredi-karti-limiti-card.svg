<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hadi kredi kartı limiti</title><desc id="desc">Toplam, kullanılan ve kullanılabilir kredi kartı limitini, ekstre ve ödeme tarihini anlatan premium kapak.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061927"/><stop offset="1" stop-color="#14384b"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9b32"/><stop offset="1" stop-color="#ff5f20"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-opacity=".28"/></filter></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="1370" cy="120" r="300" fill="#ff7a1a" opacity=".07"/><g font-family="Arial,Helvetica,sans-serif"><text x="92" y="90" fill="#ffb020" font-size="24" font-weight="700">HADİ • KREDİ KARTI LİMİTİ</text><text x="92" y="156" fill="#fff" font-size="54" font-weight="800">Kart limitini doğru oku</text><text x="92" y="204" fill="#abc3d0" font-size="23">Toplam limit, kullanılan tutar ve ekstre borcu aynı şey değildir.</text>
<g filter="url(#s)" transform="translate(100 280)"><rect width="540" height="320" rx="36" fill="url(#card)"/><text x="42" y="58" fill="#fff" font-size="26" font-weight="800">hadi</text><circle cx="454" cy="62" r="20" fill="#ffd096" opacity=".8"/><circle cx="480" cy="62" r="20" fill="#fff" opacity=".72"/><rect x="42" y="104" width="68" height="52" rx="10" fill="#ffd49d" opacity=".9"/><text x="42" y="214" fill="#fff" font-size="22" letter-spacing="4">••••  2846</text><text x="42" y="270" fill="#fff1e6" font-size="18">KULLANILABİLİR LİMİT</text><text x="490" y="270" text-anchor="end" fill="#fff" font-size="34" font-weight="800">₺8.650</text></g>
<g filter="url(#s)"><rect x="720" y="270" width="788" height="430" rx="34" fill="#f8fbfd"/><text x="770" y="326" fill="#153145" font-size="28" font-weight="800">Limit özeti</text><g><text x="770" y="392" fill="#607b8b" font-size="20">Toplam kart limiti</text><text x="1448" y="392" text-anchor="end" fill="#153145" font-size="25" font-weight="800">₺12.000</text><rect x="770" y="418" width="678" height="18" rx="9" fill="#e4edf1"/><rect x="770" y="418" width="190" height="18" rx="9" fill="#ff8a34"/></g><g><text x="770" y="490" fill="#607b8b" font-size="20">Kullanılan limit</text><text x="1448" y="490" text-anchor="end" fill="#ef6d24" font-size="25" font-weight="800">₺3.350</text></g><g><text x="770" y="552" fill="#607b8b" font-size="20">Kullanılabilir limit</text><text x="1448" y="552" text-anchor="end" fill="#139c83" font-size="25" font-weight="800">₺8.650</text></g><line x1="770" y1="590" x2="1448" y2="590" stroke="#d9e5ea"/><g><rect x="770" y="618" width="310" height="54" rx="18" fill="#eef4f7"/><text x="795" y="651" fill="#607b8b" font-size="18">Ekstre borcu</text><text x="1055" y="651" text-anchor="end" fill="#153145" font-size="21" font-weight="800">₺2.140</text><rect x="1100" y="618" width="348" height="54" rx="18" fill="#fff1df"/><text x="1125" y="651" fill="#8a5a22" font-size="18">Son ödeme</text><text x="1420" y="651" text-anchor="end" fill="#db6b20" font-size="21" font-weight="800">18 Ağustos</text></g></g>
<g><rect x="100" y="650" width="540" height="78" rx="22" fill="#102d40" stroke="#2a5267"/><circle cx="142" cy="689" r="21" fill="#ff9a32"/><text x="142" y="697" text-anchor="middle" fill="#10202a" font-size="20" font-weight="800">!</text><text x="180" y="680" fill="#fff" font-size="20" font-weight="700">Limit artışı otomatik değildir</text><text x="180" y="710" fill="#9db7c5" font-size="18">Hesap, ödeme geçmişi ve değerlendirme etkili olabilir.</text></g><text x="92" y="800" fill="#b5ccd8" font-size="20">Kart limitini değerlendirirken kullanılabilir limit kadar ekstre borcunu ve son ödeme tarihini de kontrol et.</text><text x="1485" y="855" text-anchor="end" fill="#7393a5" font-size="18">bozumcu.net</text></g></svg>
