<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobil bozumda hız ve güven akışı</title>
  <desc id="desc">Ürün uygunluğu, yazılı teklif, kod kontrolü ve banka hareketi adımlarını gösteren Sky Bozum bilgi grafiği.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071016"/><stop offset=".55" stop-color="#11121a"/><stop offset="1" stop-color="#171019"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#fb7185"/><stop offset="1" stop-color="#fb923c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/><circle cx="200" cy="120" r="260" fill="#22d3ee" opacity=".06"/><circle cx="1370" cy="760" r="290" fill="#fb7185" opacity=".07"/>
  <g stroke="#fff" stroke-opacity=".055"><path d="M0 180h1600M0 450h1600M0 720h1600"/><path d="M250 0v900M800 0v900M1350 0v900"/></g>
  <text x="95" y="110" fill="#67e8f9" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="7">HIZ + GÜVEN</text><text x="95" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="900">Doğru bilgi, kesintisiz kontrol zinciri.</text><text x="95" y="240" fill="#aab2bf" font-family="Arial,sans-serif" font-size="24">Hız; kontrolü atlamak değil, her aşamayı ilk seferde doğru tamamlamaktır.</text>
  <path d="M205 450h1190" stroke="url(#line)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(230 450)"><circle r="86" fill="#0e1720" stroke="#22d3ee" stroke-width="4"/><path d="M-24-2l18 18 36-42" fill="none" stroke="#67e8f9" stroke-width="10" stroke-linecap="round"/><text y="145" fill="#fff" font-size="28" font-weight="900">ÜRÜN UYGUNLUĞU</text><text y="184" fill="#9ca3af" font-size="20">Tür · tutar · bölge</text></g>
    <g transform="translate(610 450)"><circle r="86" fill="#17131d" stroke="#fb7185" stroke-width="4"/><rect x="-40" y="-34" width="80" height="68" rx="10" fill="none" stroke="#fda4af" stroke-width="7"/><path d="M-23-10h46M-23 10h30" stroke="#fda4af" stroke-width="6"/><text y="145" fill="#fff" font-size="28" font-weight="900">YAZILI NET TUTAR</text><text y="184" fill="#9ca3af" font-size="20">Oran · koşul · tahmin</text></g>
    <g transform="translate(990 450)"><circle r="86" fill="#17131d" stroke="#fb7185" stroke-width="4"/><path d="M0-46l48 18v34c0 34-22 55-48 68-26-13-48-34-48-68v-34z" fill="none" stroke="#fda4af" stroke-width="7"/><path d="M-20 4l15 15 29-33" fill="none" stroke="#fda4af" stroke-width="8"/><text y="145" fill="#fff" font-size="28" font-weight="900">KOD KONTROLÜ</text><text y="184" fill="#9ca3af" font-size="20">Kullanım · para birimi</text></g>
    <g transform="translate(1370 450)"><circle r="86" fill="#1a1515" stroke="#fb923c" stroke-width="4"/><path d="M-42 26h84M-35 26v-58h70v58M-48-32L0-62l48 30" fill="none" stroke="#fdba74" stroke-width="7"/><text y="145" fill="#fff" font-size="28" font-weight="900">GERÇEK HAREKET</text><text y="184" fill="#9ca3af" font-size="20">Banka hesabında kontrol</text></g>
  </g>
  <rect x="95" y="735" width="1410" height="85" rx="24" fill="#fff" opacity=".035" stroke="#fff" stroke-opacity=".1"/><text x="800" y="788" text-anchor="middle" fill="#d6d9df" font-family="Arial,sans-serif" font-size="24" font-weight="700">Önce uygunluk alın → sonra ürünü satın alın → yalnız doğrulanan resmî kanalda ilerleyin.</text>
</svg>
