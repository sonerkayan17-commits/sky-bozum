<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobil bozum net ödeme karşılaştırması</title>
  <desc id="desc">Başlangıç bütçesi, ürün maliyeti, oran ve net ödeme arasındaki ilişkiyi gösteren Sky Bozum bilgi grafiği.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0c13"/><stop offset=".55" stop-color="#171019"/><stop offset="1" stop-color="#12150e"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/><g stroke="#fff" stroke-opacity=".05"><path d="M0 180h1600M0 460h1600M0 740h1600"/><path d="M200 0v900M800 0v900M1400 0v900"/></g><circle cx="1320" cy="150" r="260" fill="#fbbf24" opacity=".055"/>
  <text x="100" y="110" fill="#fcd34d" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="7">NET ÖDEME REHBERİ</text><text x="100" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="900">Yüzdeyi değil, elinize geçen tutarı karşılaştırın.</text><text x="100" y="240" fill="#aab2bf" font-family="Arial,sans-serif" font-size="24">Aynı ürün, aynı bölge ve aynı tarih olmadan oran karşılaştırması eksik kalır.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(100 325)"><rect width="330" height="310" rx="30" fill="#121722" stroke="#fbbf24" stroke-opacity=".35"/><text x="34" y="55" fill="#fcd34d" font-size="22" font-weight="800">01 · BAŞLANGIÇ</text><text x="34" y="125" fill="#fff" font-size="39" font-weight="900">Bütçe</text><text x="34" y="175" fill="#9ca3af" font-size="21"><tspan x="34">Harcamayı planladığınız</tspan><tspan x="34" dy="31">toplam tutar.</tspan></text></g>
    <text x="464" y="495" fill="#fbbf24" font-size="45" font-weight="900">−</text>
    <g transform="translate(510 325)"><rect width="330" height="310" rx="30" fill="#121722" stroke="#fbbf24" stroke-opacity=".35"/><text x="34" y="55" fill="#fcd34d" font-size="22" font-weight="800">02 · MALİYET</text><text x="34" y="125" fill="#fff" font-size="39" font-weight="900">Ürün fiyatı</text><text x="34" y="175" fill="#9ca3af" font-size="21"><tspan x="34">Mağaza fiyatı ve varsa</tspan><tspan x="34" dy="31">ödeme ücreti.</tspan></text></g>
    <text x="874" y="495" fill="#fb7185" font-size="45" font-weight="900">×</text>
    <g transform="translate(920 325)"><rect width="260" height="310" rx="30" fill="#121722" stroke="#fb7185" stroke-opacity=".4"/><text x="32" y="55" fill="#fda4af" font-size="22" font-weight="800">03 · ORAN</text><text x="32" y="125" fill="#fff" font-size="39" font-weight="900">Güncel %</text><text x="32" y="175" fill="#9ca3af" font-size="21"><tspan x="32">Ürün ve stok için</tspan><tspan x="32" dy="31">yazılı teyit.</tspan></text></g>
    <text x="1214" y="495" fill="#fb7185" font-size="45" font-weight="900">=</text>
    <g transform="translate(1260 325)"><rect width="240" height="310" rx="30" fill="#1b1319" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/><text x="30" y="55" fill="#fda4af" font-size="22" font-weight="800">04 · SONUÇ</text><text x="30" y="125" fill="#fff" font-size="39" font-weight="900">Net ödeme</text><text x="30" y="175" fill="#d2d5db" font-size="21"><tspan x="30">Hesaba geçmesi</tspan><tspan x="30" dy="31">beklenen tutar.</tspan></text></g>
  </g>
  <rect x="100" y="710" width="1400" height="100" rx="25" fill="#fbbf24" opacity=".065" stroke="#fbbf24" stroke-opacity=".3"/><text x="145" y="770" fill="#fde7a4" font-family="Arial,sans-serif" font-size="24" font-weight="700">“Komisyonsuz” ifadesi tek başına avantaj kanıtı değildir. Teklifte ürün, tarih ve net tutar birlikte yazmalıdır.</text>
</svg>
