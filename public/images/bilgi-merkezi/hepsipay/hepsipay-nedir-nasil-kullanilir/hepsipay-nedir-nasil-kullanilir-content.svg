<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hepsipay nasıl kullanılır?</title><desc id="desc">Hepsipay cüzdanını kullanma sürecini bakiye kontrolü, ödeme aracı seçimi, doğrulama ve işlem sonucu adımlarıyla anlatan makale içi infografik.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#12384d"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6500"/><stop offset="1" stop-color="#ffa13a"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1fd0ba"/><stop offset="1" stop-color="#0b8176"/></linearGradient></defs>
<rect width="1600" height="900" rx="58" fill="url(#bg)"/><circle cx="1450" cy="100" r="280" fill="#ff6b00" opacity=".07"/><circle cx="130" cy="820" r="280" fill="#1fd0ba" opacity=".05"/>
<text x="90" y="98" fill="#ff8a18" font-size="24" font-family="Arial" font-weight="700" letter-spacing="3">ADIM ADIM KULLANIM</text><text x="90" y="164" fill="#fff" font-size="56" font-family="Arial" font-weight="700">Hepsipay nasıl kullanılır?</text><text x="90" y="210" fill="#a9c0cd" font-size="23" font-family="Arial">Ödeme öncesinden işlem sonucuna kadar dört temel kontrol</text>
<g transform="translate(80 300)">
<g><rect width="335" height="390" rx="32" fill="#f7fbfd"/><circle cx="48" cy="48" r="26" fill="url(#green)"/><text x="48" y="57" fill="#fff" font-size="22" font-family="Arial" font-weight="700" text-anchor="middle">1</text><text x="88" y="56" fill="#17384a" font-size="22" font-family="Arial" font-weight="700">Bakiyeyi kontrol et</text><rect x="30" y="104" width="275" height="132" rx="24" fill="url(#orange)"/><text x="56" y="144" fill="#fff" font-size="17" font-family="Arial">KULLANILABİLİR BAKİYE</text><text x="56" y="198" fill="#fff" font-size="40" font-family="Arial" font-weight="700">₺ 8.240</text><g transform="translate(30 270)"><circle cx="18" cy="18" r="18" fill="#e8f7f4"/><path d="M10 18l6 6 11-14" fill="none" stroke="#0c9a8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="24" fill="#607d8c" font-size="17" font-family="Arial">Tutar işlem için yeterli mi?</text></g></g>
<path d="M350 194h45" stroke="#708f9f" stroke-width="7" stroke-linecap="round"/><path d="M384 182l14 12-14 12" fill="none" stroke="#ff8a18" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(410)"><rect width="335" height="390" rx="32" fill="#f7fbfd"/><circle cx="48" cy="48" r="26" fill="#ff8a18"/><text x="48" y="57" fill="#fff" font-size="22" font-family="Arial" font-weight="700" text-anchor="middle">2</text><text x="88" y="56" fill="#17384a" font-size="22" font-family="Arial" font-weight="700">Ödeme aracını seç</text><g transform="translate(30 110)"><rect width="275" height="70" rx="20" fill="#17384a"/><circle cx="38" cy="35" r="18" fill="#1fd0ba"/><text x="72" y="42" fill="#fff" font-size="19" font-family="Arial">Hepsipay cüzdan</text></g><g transform="translate(30 196)"><rect width="275" height="70" rx="20" fill="#eaf2f6"/><circle cx="38" cy="35" r="18" fill="#ff8a18"/><text x="72" y="42" fill="#17384a" font-size="19" font-family="Arial">Kayıtlı banka kartı</text></g><g transform="translate(30 282)"><rect width="275" height="70" rx="20" fill="#eaf2f6"/><circle cx="38" cy="35" r="18" fill="#245bff"/><text x="72" y="42" fill="#17384a" font-size="19" font-family="Arial">Tanımlı alışveriş limiti</text></g></g>
