<path d="M1170 194h45" stroke="#708f9f" stroke-width="7" stroke-linecap="round"/><path d="M1204 182l14 12-14 12" fill="none" stroke="#1fd0ba" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
