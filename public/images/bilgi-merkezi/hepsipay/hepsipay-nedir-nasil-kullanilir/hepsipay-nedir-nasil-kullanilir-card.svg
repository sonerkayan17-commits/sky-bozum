    <text x="0" y="112" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#fff">Hepsipay nedir?</text>
    <text x="0" y="176" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#b9cddd">Tek cüzdan, dört farklı ürün mantığı</text>
    <text x="0" y="234" font-family="Arial,sans-serif" font-size="22" fill="#8fa8bc">Ödeme yöntemini doğru seç, ürün türünü karıştırma.</text>

