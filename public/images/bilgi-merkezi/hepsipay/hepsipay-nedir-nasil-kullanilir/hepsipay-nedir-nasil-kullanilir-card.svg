      <rect width="520" height="260" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="34" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ff9b32">KULLANMADAN ÖNCE AYIRT ET</text>
      <g font-family="Arial,sans-serif" font-size="21" fill="#eaf3f8">
        <circle cx="48" cy="102" r="7" fill="#ff7a16"/><text x="70" y="110">Kayıtlı kart ve cüzdan bakiyesi</text>
        <circle cx="48" cy="148" r="7" fill="#f6c84f"/><text x="70" y="156">Hepsipara kampanya ödülü</text>
        <circle cx="48" cy="194" r="7" fill="#25c8b5"/><text x="70" y="202">Hepsiburada alışveriş limiti</text>
        <circle cx="48" cy="240" r="7" fill="#79a7ff"/><text x="70" y="248">Anlaşmalı banka hızlı kredisi</text>
      </g>
    </g>
