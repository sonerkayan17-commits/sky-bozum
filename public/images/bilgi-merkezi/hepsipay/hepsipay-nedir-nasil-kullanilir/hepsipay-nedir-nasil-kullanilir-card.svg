<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hepsipay nedir ve nasıl kullanılır?</title>
  <desc id="desc">Hepsipay cüzdanı, Hepsipara, alışveriş limiti ve hızlı kredi ürünlerinin tek ekosistemde ayrışmasını anlatan premium editoryal kapak.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071421"/><stop offset=".55" stop-color="#10283c"/><stop offset="1" stop-color="#07131f"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9b32"/><stop offset="1" stop-color="#ff5a00"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity=".34"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1285" cy="155" r="220" fill="#ff6a00" opacity=".10" filter="url(#glow)"/>
  <circle cx="1015" cy="765" r="250" fill="#21c7b7" opacity=".08" filter="url(#glow)"/>
  <g opacity=".18" stroke="#8fb1c9"><path d="M780 110H1480"/><path d="M780 790H1480"/><path d="M815 70V825"/><path d="M1450 70V825"/></g>

