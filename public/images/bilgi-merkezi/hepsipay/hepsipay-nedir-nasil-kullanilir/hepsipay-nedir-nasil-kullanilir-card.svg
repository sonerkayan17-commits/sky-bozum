      <rect x="168" width="150" height="94" rx="24" fill="#edf3ff" stroke="#b8ccff"/><circle cx="208" cy="46" r="22" fill="#79a7ff"/><path d="M197 50l9-9 13 13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="240" y="39" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#233b4d">Kredi</text><text x="240" y="61" font-family="Arial,sans-serif" font-size="13" fill="#6c8292">Banka teklifi</text>
    </g>
