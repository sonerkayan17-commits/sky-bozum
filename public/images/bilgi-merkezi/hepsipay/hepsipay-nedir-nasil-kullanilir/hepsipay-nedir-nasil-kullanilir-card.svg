      <circle cx="48" cy="46" r="25" fill="#f6c84f"/><path d="M38 34l20 24M58 34L38 58" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <text x="88" y="38" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#233b4d">Hepsipara</text><text x="88" y="64" font-family="Arial,sans-serif" font-size="15" fill="#6c8292">Kampanya ödülü</text>
    </g>
    <g transform="translate(176 468)">
