  <g transform="translate(740 700)"><path d="M0 0H760" stroke="#29465b" stroke-width="2"/><circle cx="65" cy="0" r="7" fill="#ff7a16"/><circle cx="270" cy="0" r="7" fill="#f6c84f"/><circle cx="475" cy="0" r="7" fill="#25c8b5"/><circle cx="680" cy="0" r="7" fill="#79a7ff"/></g>
  <text x="1490" y="842" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6f899d">SKY BOZUM • BİLGİ MERKEZİ</text>
