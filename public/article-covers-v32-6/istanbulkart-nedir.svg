<rect x="70" y="590" width="1060" height="42" rx="18" fill="#0d2636" stroke="#22495f"/><text x="92" y="617" fill="#9ec7d6" font-family="Arial" font-size="15">Bakiye, kart türü ve kullanım noktası birlikte kontrol edilmelidir.</text><text x="1085" y="617" text-anchor="end" fill="#62dcf7" font-family="Arial" font-size="15" font-weight="700">bozumcu.net</text>
