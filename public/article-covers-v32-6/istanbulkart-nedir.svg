<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">İstanbulkart nedir?</title><desc id="desc">İstanbulkart bakiye, ulaşım, ödeme ve kullanım alanlarını anlatan premium editoryal kapak.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset=".55" stop-color="#0d2436"/><stop offset="1" stop-color="#102d3f"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00b7d9"/><stop offset="1" stop-color="#006c9e"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3be0ff"/><stop offset="1" stop-color="#00a8d2"/></linearGradient></defs>
<rect width="1200" height="675" rx="36" fill="url(#bg)"/>
<circle cx="1030" cy="105" r="180" fill="#0db7d8" opacity=".08"/><circle cx="940" cy="620" r="250" fill="#1288b2" opacity=".08"/>
<text x="70" y="72" fill="#62dcf7" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">İSTANBULKART REHBERİ</text>
<text x="70" y="132" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="800">İstanbulkart nedir?</text>
<text x="70" y="173" fill="#b7ceda" font-family="Arial, sans-serif" font-size="21">Ulaşım, bakiye ve şehir içi ödeme kullanımını tek bakışta öğren.</text>
<g transform="translate(70 225)"><rect width="470" height="330" rx="28" fill="#0b1926" stroke="#24465c"/><text x="28" y="42" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Kartın temel kullanım alanları</text>
<g transform="translate(28 72)"><rect width="128" height="102" rx="18" fill="#0f2b3c"/><circle cx="64" cy="36" r="18" fill="#18c2e3"/><path d="M52 34h24M57 28h14M57 40h14" stroke="#07111d" stroke-width="4" stroke-linecap="round"/><text x="64" y="76" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="700">Toplu taşıma</text></g>
<g transform="translate(171 72)"><rect width="128" height="102" rx="18" fill="#0f2b3c"/><circle cx="64" cy="36" r="18" fill="#18c2e3"/><path d="M55 29h18v16H55zM59 25v4M69 25v4" fill="none" stroke="#07111d" stroke-width="4"/><text x="64" y="76" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="700">Bakiye yükleme</text></g>
<g transform="translate(314 72)"><rect width="128" height="102" rx="18" fill="#0f2b3c"/><circle cx="64" cy="36" r="18" fill="#18c2e3"/><path d="M52 31h24v13H52zM56 27h16" fill="none" stroke="#07111d" stroke-width="4"/><text x="64" y="76" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="700">Şehir içi ödeme</text></g>
<g transform="translate(28 198)"><circle cx="10" cy="10" r="10" fill="#2ad7b7"/><path d="m5 10 3 3 7-8" fill="none" stroke="#06131d" stroke-width="3"/><text x="30" y="15" fill="#d9e7ee" font-family="Arial" font-size="17">Kart ve mobil uygulama birlikte kullanılabilir</text><circle cx="10" cy="50" r="10" fill="#2ad7b7"/><path d="m5 50 3 3 7-8" fill="none" stroke="#06131d" stroke-width="3"/><text x="30" y="55" fill="#d9e7ee" font-family="Arial" font-size="17">Bakiye, kart türüne göre farklı kurallara tabidir</text></g></g>
